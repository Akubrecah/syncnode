<style data-emotion-css="rc-table-styles">
.rc-table {
  font-size: 12px;
  color: #eaecef;
  position: relative;
  line-height: 1.5;
  width: 100%;
  border-collapse: collapse;
}
.rc-table table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.rc-table th {
  background: #181A20;
  color: #848E9C;
  font-size: 12px;
  font-weight: 500;
  padding: 14px 16px;
  border-bottom: 1px solid #29313D;
  white-space: nowrap;
}
.rc-table td {
  border-bottom: 1px solid #29313D;
  background-color: transparent;
  color: #EAECEF;
  font-size: 13px;
  padding: 14px 16px;
  white-space: nowrap;
  transition: background 0.15s ease;
}
.rc-table tr:hover td {
  background-color: #252C37;
}
.footer-wrapper {
  background: #0B0E11;
  color: #848E9C;
}
.footer-navlist-title {
  color: #EAECEF;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 14px;
}
.footer-navlist-item-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.footer-navlist-item a {
  color: #848E9C;
  text-decoration: none;
  font-size: 12.5px;
  transition: color 0.15s;
}
.footer-navlist-item a:hover {
  color: #FCD535;
}
.footer-icongroup {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.footer-icon {
  width: 20px;
  height: 20px;
  color: #848E9C;
  transition: color 0.15s;
}
.footer-icon:hover {
  color: #FCD535;
}
