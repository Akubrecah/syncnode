[project]
name = "syncnode"
version = "1.0.0"
description = "Syncnode Enterprise Cryptocurrency Exchange Infrastructure (Python Core)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "websockets>=13.0",
    "jinja2>=3.1.4",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
