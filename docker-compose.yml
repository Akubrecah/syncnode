version: '3.8'

services:
  syncnode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncnode-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-syncnode-production-master-secret-key-change-me-on-vps}
      - CORS_ORIGINS=*
      - RATE_LIMIT_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
