# ==============================================================================
# Production High-Performance Nginx Reverse Proxy Configuration for Syncnode
# Features:
# - Gzip & Brotli compression for ultra-fast asset delivery
# - Long-lived cache headers for immutable static chunks (JS/CSS/Fonts)
# - Real-time WebSocket (/ws) upgrade proxying with zero timeout disconnects
# - HTTP/2 and modern SSL cipher hardening
# - Microsecond response proxy buffers
# ==============================================================================

upstream syncnode_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    # Gzip Compression for maximum load speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Maximum client payload size (for KYC document uploads)
    client_max_body_size 25M;

    # Static assets direct serving & caching (if serving from host filesystem)
    location /assets/ {
        proxy_pass http://syncnode_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # WebSocket Proxy for Real-Time OrderBook & Balance Streaming
    location /ws {
        proxy_pass http://syncnode_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (prevent disconnects on idle connections)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API Gateway & SPA Routing
    location / {
        proxy_pass http://syncnode_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy buffering settings for ultra-low latency
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
